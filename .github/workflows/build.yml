name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/simple/debug/app-simple-debug.apk G1-Hotelo-${{ github.run_number }}.apk
          cp app/build/outputs/apk/pro/debug/app-pro-debug.apk G1-Hotelo-Pro-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: G1-Hotelo-apk
          path: G1-Hotelo*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: G1 Hotelo — сборка ${{ github.run_number }}
          files: G1-Hotelo*.apk
